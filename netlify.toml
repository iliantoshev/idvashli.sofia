[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Страниците с профили, админ и заведения не трябва да се показват в Google
[[headers]]
  for = "/app.html"
  [headers.values]
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/venue.html"
  [headers.values]
    X-Robots-Tag = "noindex"
